[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falvorn-ai"
version = "0.1.0"
description = "Falvorn AI - independent autonomous browser agent MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Falvorn AI" }]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "playwright>=1.50,<2",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]
mcp = ["mcp>=1,<2"]

[project.scripts]
falvornctl = "falvorn.cli:main"

[tool.setuptools]
packages = ["falvorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
falvorn = ["static/*.html"]
