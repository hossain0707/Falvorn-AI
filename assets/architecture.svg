<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">Falvorn AI Architecture</title><desc id="desc">Client and UI enter through the FastAPI gateway, which coordinates AI Agent, Browser, Fetch and Monitor. Persistent SQLite stores run events and monitor subscriptions, with local Chromium and optional external providers.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset="1" stop-color="#111f37"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6"/></filter><style>@keyframes link{to{stroke-dashoffset:-80}}@keyframes beat{0%,100%{opacity:.45}50%{opacity:1}}.link{stroke-dasharray:8 12;animation:link 2.7s linear infinite}.dot{animation:beat 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.link,.dot{animation:none}}</style></defs>
<rect width="1280" height="650" rx="24" fill="url(#bg)"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#edf6ff"><text x="44" y="63" font-size="30" font-weight="700">FALVORN AI  /  System architecture</text><text x="45" y="92" fill="#91a8c6" font-size="17">Modular monolith · local-first · single-node prototype</text></g>
<g stroke="#5b89a6" stroke-width="2" fill="none"><path class="link" d="M640 180V221"/><path class="link" d="M640 290V329H197V353M640 329H484V353M640 329H796V353M640 329H1076V353"/><path class="link" d="M200 437V497H640V518M483 437V497H640M798 437V497H640M1076 437V497H640"/><path class="link" d="M640 290V305"/></g>
<rect x="424" y="118" width="432" height="67" rx="18" fill="#1f3954" stroke="#538eae" stroke-width="2"/><text x="640" y="149" text-anchor="middle" fill="#efffff" font-family="DejaVu Sans,Arial" font-size="23" font-weight="700">Dashboard / SDK / MCP clients</text><text x="640" y="170" text-anchor="middle" fill="#9ecdd8" font-family="DejaVu Sans,Arial" font-size="13">Human-authorized requests</text>
<rect x="402" y="221" width="476" height="69" rx="18" fill="#232957" stroke="#998bee" stroke-width="2"/><text x="640" y="253" text-anchor="middle" font-size="23" font-weight="700" font-family="DejaVu Sans,Arial" fill="#f0edff">Falvorn API  /  FastAPI</text><text x="640" y="275" text-anchor="middle" font-size="14" fill="#b1bdf2" font-family="DejaVu Sans,Arial">Auth · validation · endpoint contracts</text>
<g font-family="DejaVu Sans,Arial" text-anchor="middle"><rect x="54" y="353" rx="16" width="285" height="85" fill="#17344b" stroke="#62d9e8" stroke-width="2"/><text x="196" y="390" font-size="21" font-weight="700" fill="#d8fbff">Falvorn Agent</text><text x="196" y="416" font-size="14" fill="#96ccd9">LLM planner · bounded tasks</text>
<rect x="359" y="353" rx="16" width="255" height="85" fill="#1b3152" stroke="#678ef3" stroke-width="2"/><text x="486" y="390" font-size="21" font-weight="700" fill="#eef4ff">Falvorn Browser</text><text x="486" y="416" font-size="14" fill="#a9bff1">Playwright · Chromium</text>
<rect x="635" y="353" rx="16" width="310" height="85" fill="#29304f" stroke="#b1a2f7" stroke-width="2"/><text x="790" y="390" font-size="21" font-weight="700" fill="#f0ecff">Search &amp; Fetch</text><text x="790" y="416" font-size="14" fill="#c5bbef">HTTPX · HTML · SearXNG</text>
<rect x="966" y="353" rx="16" width="266" height="85" fill="#1e403f" stroke="#5eccae" stroke-width="2"/><text x="1099" y="390" font-size="21" font-weight="700" fill="#e3fff1">Monitor</text><text x="1099" y="416" font-size="14" fill="#a3e4cb">Checks · optional scheduler</text>
<rect x="367" y="518" rx="18" width="551" height="78" fill="#1c2b3e" stroke="#64829e" stroke-width="2"/><text x="640" y="552" font-size="23" font-weight="700" fill="#e2f1ff">Falvorn Core  +  SQLite</text><text x="640" y="576" font-size="14" fill="#9baec8">Policies · settings · durable run events · monitor records</text></g>
<circle class="dot" cx="640" cy="331" r="6" fill="#70e6ec"/><circle class="dot" cx="640" cy="500" r="5" fill="#b1a4ed"/>
<text x="53" y="622" fill="#7c95b2" font-family="DejaVu Sans,Arial" font-size="14">Dashed flows animate in SVG viewers. Not a claim of distributed production infrastructure.</text>
</svg>
