<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Falvorn AI — Intelligence Without Limits</title><desc id="desc">Dark premium product banner with stylized falcon wing, orbit, and glowing flight path.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080F22"/><stop offset="1" stop-color="#172345"/></linearGradient><linearGradient id="wing" x2="1" y2="1"><stop stop-color="#64e6e9"/><stop offset=".53" stop-color="#9da5ff"/><stop offset="1" stop-color="#685afa"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><style>@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(-14px,-8px)}100%{transform:translate(0,0)}}@keyframes dash{to{stroke-dashoffset:-220}}@keyframes pulse{0%,100%{opacity:.36}50%{opacity:.9}}.wing{animation:drift 8s ease-in-out infinite}.trace{animation:dash 8s linear infinite}.orb{animation:pulse 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.wing,.trace,.orb{animation:none}}</style></defs>
<rect width="1280" height="440" rx="32" fill="url(#bg)"/><g opacity=".12" stroke="#bdd5ee"><path d="M0 90H1280 M0 180H1280 M0 270H1280 M0 360H1280 M90 0V440 M240 0V440 M390 0V440 M540 0V440 M690 0V440 M840 0V440 M990 0V440 M1140 0V440"/></g>
<circle cx="1000" cy="220" r="170" fill="none" stroke="#6d8fee" stroke-opacity=".23" stroke-width="2"/><circle cx="1000" cy="220" r="118" fill="none" stroke="#76dbec" stroke-opacity=".16" stroke-dasharray="6 10" stroke-width="2"/>
<path class="trace" d="M688 323C830 363 919 295 1020 185C1080 125 1140 148 1220 70" stroke="#65e1f0" stroke-width="3" stroke-dasharray="20 24" fill="none" opacity=".62"/><circle class="orb" cx="1113" cy="157" r="12" fill="#70d5ee" opacity=".7" filter="url(#glow)"/>
<g class="wing"><path d="M961 217L798 93L953 148L1115 75L1050 189L1203 168L1087 250L1166 321L1008 288L908 360L928 267L860 237Z" fill="url(#wing)" opacity=".93"/><path d="M961 217L798 93L1027 185L1115 75L1050 189L1203 168L1087 250L1166 321L1008 288L908 360L928 267" fill="none" stroke="#dff6ff" stroke-width="3" opacity=".5"/><path d="M951 222L1044 204L1069 221L1031 238Z" fill="#08132c"/><circle cx="1047" cy="219" r="4" fill="#91eaf3"/><path d="M908 360L961 217L1008 288" fill="none" stroke="#0d1d3e" stroke-width="9" opacity=".35"/></g>
