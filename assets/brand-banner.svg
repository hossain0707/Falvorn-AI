<text x="85" y="307" fill="#abbcd3" font-family="DejaVu Sans,Arial,sans-serif" font-size="25">Intelligence without limits. Built for precision.</text><rect x="83" y="345" rx="16" width="214" height="40" fill="#223854" stroke="#476481"/><text x="103" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="600" fill="#bfe8f2">AGENT  ·  BROWSER  ·  API</text>
