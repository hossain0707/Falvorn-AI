# One-shot publish, expressly authorized by the repo owner on 2026-10-29.
# Not a recurring deployment or project-memory writer.
name: Publish Falvorn AI v0.2.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: falvorn-v0.2-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libgl1 libcairo2
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86 Pillow==11.3.0 CairoSVG==2.8.2
          python -m playwright install --with-deps chromium
      - name: Verify candidate
        run: |
          python -m compileall -q falvorn
          python -m pytest -q
      - name: Start isolated local demo fixture and Falvorn API
        env:
          ALLOW_PRIVATE_TARGETS: 'true'
          MONITOR_SCHEDULER_ENABLED: 'false'
          FALVORN_API_KEY: ''
          HOST: 127.0.0.1
        run: |
          python -m http.server 9001 --bind 127.0.0.1 --directory scripts/demo_fixture > /tmp/falvorn-fixture.log 2>&1 &
          python -m falvorn > /tmp/falvorn-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:9001/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:9001/ > /dev/null
          curl -fsS -X POST http://127.0.0.1:8000/v1/fetch -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:9001"}' | python -c 'import sys,json; x=json.load(sys.stdin); assert x["title"] == "Falvorn Demo Library"'
      - name: Render honest, reproducible dashboard walkthrough
        env:
          ALLOW_PRIVATE_TARGETS: 'true'
          FALVORN_DEMO_WORK_DIR: .build/demo-work
        run: |
          python scripts/capture_demo.py
          python scripts/render_demo.py
          test -s assets/demo/falvorn-preview.gif
          test -s assets/demo/falvorn-walkthrough.mp4
      - name: Commit approved binary media to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/demo/falvorn-preview.gif assets/demo/falvorn-walkthrough.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'docs(demo): publish reproducible Falvorn v0.2 GIF and MP4'
            git push origin HEAD:main
          fi
      - name: Create v0.2.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --tags origin refs/tags/v0.2.0 | grep -q v0.2.0; then
            echo 'v0.2.0 tag already exists; refusing to retag or overwrite.'
          else
            git tag -a v0.2.0 -m 'Falvorn AI v0.2.0 experimental release'
            git push origin refs/tags/v0.2.0
          fi
          git archive --format=zip --output=Falvorn-AI-v0.2.0-source-and-demo.zip HEAD
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo 'Release exists; uploading the requested media assets.'
            gh release upload v0.2.0 Falvorn-AI-v0.2.0-source-and-demo.zip assets/demo/falvorn-walkthrough.mp4 assets/demo/falvorn-preview.gif --clobber
          else
            gh release create v0.2.0 Falvorn-AI-v0.2.0-source-and-demo.zip assets/demo/falvorn-walkthrough.mp4 assets/demo/falvorn-preview.gif --title 'Falvorn AI v0.2.0 — Experimental Release' --notes-file RELEASE_NOTES_v0.2.md --latest
          fi
